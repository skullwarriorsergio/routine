<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#131920">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Push Pull Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: gym whiteboard. Home = 2×2 day tiles (Push | Pull × 1 | 2); a day = exercise rows grouped
   like the workbook (main lifts | accessories | legs); tapping a row opens a how-to sheet from the bottom. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --ink:#131920; --muted:#58636E; --line:#D3D9DF;
  --push:#C2410C; --pull:#0D6C78; --on-kind:#FFFFFF;
  --push-soft:#FBE8DE; --pull-soft:#DCEFF1; --photo:#FFFFFF; --scrim:rgba(9,13,17,.45);
  --bar-bg:#131920; --bar-ink:#F1F4F7; --bar-dim:rgba(241,244,247,.62); --bar-line:rgba(241,244,247,.16);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --sticky-top:0px; --bar-pad:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1014; --surface:#161C22; --ink:#E6EBF0; --muted:#97A3AE; --line:#27313A;
  --push:#F0844F; --pull:#46B9C6; --on-kind:#0C1014;
  --push-soft:#3A2318; --pull-soft:#11313A; --photo:#F3F5F7; --scrim:rgba(0,0,0,.62);
  --bar-bg:#161C22; --bar-ink:#E6EBF0; --bar-dim:rgba(230,235,240,.6); --bar-line:rgba(230,235,240,.16); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1014; --surface:#161C22; --ink:#E6EBF0; --muted:#97A3AE; --line:#27313A;
  --push:#F0844F; --pull:#46B9C6; --on-kind:#0C1014;
  --push-soft:#3A2318; --pull-soft:#11313A; --photo:#F3F5F7; --scrim:rgba(0,0,0,.62);
  --bar-bg:#161C22; --bar-ink:#E6EBF0; --bar-dim:rgba(230,235,240,.6); --bar-line:rgba(230,235,240,.16); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--pull);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px calc(32px + env(safe-area-inset-bottom,0px))}

/* top bar */
.bar{position:sticky;top:var(--sticky-top);z-index:5;background:var(--bar-bg);color:var(--bar-ink);
  padding:calc(var(--bar-pad) + 8px) 16px 8px;display:flex;align-items:center;gap:12px}
.bar-inner{max-width:528px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px}
.back{display:flex;align-items:center;gap:2px;color:var(--bar-ink);font-weight:600;padding:6px 4px 6px 0;min-height:44px}
.back svg{width:22px;height:22px}
.title{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{min-width:44px;min-height:32px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar .lang{background:transparent;border-color:var(--bar-line)}
.bar .lang button{color:var(--bar-dim)}
.bar .lang button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar-bg)}

/* home */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  min-height:172px;padding:14px 14px 12px;border-radius:18px;background:var(--kind);color:var(--on-kind);overflow:hidden}
.tile.push{--kind:var(--push)} .tile.pull{--kind:var(--pull)}
.tile-kind{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.tile-num{font:700 76px/.82 var(--display);letter-spacing:-.01em}
.tile-focus{font-size:12.5px;line-height:1.3;opacity:.95;margin-top:auto}
.tile-meta{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.tile:active{transform:scale(.98)}
.hint{color:var(--muted);font-size:13px;margin:12px 2px 0}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.list li+li .ex{border-top:1px solid var(--line)}
.ex{width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:10px 12px;text-align:left;min-height:76px}
.ex:active{background:var(--line)}
.thumb{width:60px;height:60px;border-radius:12px;background:var(--photo);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.none{background:var(--surface);border-style:dashed;color:var(--muted)}
.thumb.none svg{width:26px;height:26px}
.ex-name{display:block;font-weight:600;line-height:1.25}
.ex-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
  background:var(--bg);color:var(--muted)}
.chip.cable{background:var(--pull-soft);color:var(--pull)}
.ex-sets{font:700 17px/1.1 var(--display);letter-spacing:.02em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-sets small{display:block;font:600 11px/1.2 var(--body);color:var(--muted);letter-spacing:0;white-space:normal;max-width:84px}

/* day */
.day-head{border-radius:18px;padding:16px;margin-top:6px;background:var(--kind);color:var(--on-kind)}
.day-head.push{--kind:var(--push)} .day-head.pull{--kind:var(--pull)}
.day-head h2{font:700 44px/.9 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.day-head p{margin:8px 0 0;font-size:14px}
.day-head .meta{font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.group{margin-top:22px}
.group-label{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.run{border-left:3px solid var(--pull);padding-left:10px;margin-left:2px}
.run-label{font-size:12px;font-weight:700;color:var(--pull);margin:0 0 8px;display:flex;gap:6px;align-items:center}
.run-label svg{width:16px;height:16px}
.run+ .list, .list+ .run{margin-top:10px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.tile:active{transform:none}}
.sheet-inner{max-width:528px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.close{font-weight:700;color:var(--muted);min-height:44px;padding:0 4px}
.photo{background:var(--photo);border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;
  height:280px;max-width:100%;overflow:hidden}
.photo img{max-height:268px;max-width:96%;width:auto;height:auto;object-fit:contain;image-rendering:auto}
.photo.none{background:var(--bg);border-style:dashed;color:var(--muted);text-align:center;gap:6px;align-content:center;font-size:14px}
.photo.none strong{font-size:16px;color:var(--ink)}
.photo.none svg{width:40px;height:40px;margin:0 auto}
.sheet h2{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:16px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--bg)}
.fact.kind{background:var(--kind-soft);color:var(--kind)}
.sheet h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.sheet p{margin:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font:700 16px/26px var(--display);width:26px;height:26px;border-radius:50%;
  background:var(--kind);color:var(--on-kind);text-align:center}
.tips{margin:0;padding-left:18px;display:grid;gap:6px}
.tips li::marker{color:var(--kind)}
.plan{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--kind-soft);display:grid;gap:6px;font-size:14px}
.plan p{margin:0}
.plan strong{color:var(--kind);margin-right:4px}
.rules{list-style:none;margin:0;padding:14px 16px;background:var(--surface);border-radius:16px;display:grid;gap:10px;font-size:14px}
.rules b{color:var(--ink)}
.wt{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;align-self:center}
.log{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;display:grid;gap:10px}
.sheet .log h3{margin:0}
.stepper{display:grid;grid-template-columns:60px minmax(0,1fr) 60px;gap:8px;align-items:center}
.stepper button{min-height:52px;border-radius:12px;background:var(--bg);font:700 20px/1 var(--display);letter-spacing:.02em}
.w-field{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:12px;background:var(--bg);padding:0 12px}
.w-field:focus-within{outline:2px solid var(--kind);outline-offset:1px}
.w-field input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:700 30px/1 var(--display);
  text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;padding:0}
.w-field input::-webkit-outer-spin-button,.w-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.w-field input:focus{outline:none}
.w-field .unit{font-weight:700;color:var(--muted);flex:none}
.log-meta{font-size:13px;color:var(--muted)}
.warm{font-size:14px;font-variant-numeric:tabular-nums}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;
  border-radius:14px;background:var(--surface);font-weight:700;letter-spacing:.02em}
.toggle .chev{font-size:13px;color:var(--kind)}
.toggle-body{margin-top:8px}
.toggle-body .log-meta{margin:8px 2px 0}
.warm-line{display:block;margin-top:4px;font:700 16px/1.2 var(--display);letter-spacing:.02em;color:var(--kind);font-variant-numeric:tabular-nums}
.pre-note{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.ex.static{cursor:default}.ex.static:active{background:none}
.legwarm{background:var(--surface);border-radius:14px;padding:12px 14px}
.warm strong{color:var(--kind);margin-right:6px}
.pyr{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pyr li{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.pyr li:first-child{background:var(--kind-soft)}
.pyr b{font:700 18px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
.hist span:first-child{background:var(--kind-soft);color:var(--kind)}
.data{background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:10px;font-size:14px}
.data .row{display:flex;gap:8px;flex-wrap:wrap}
.data button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--bg);font-weight:700}
.data button:disabled{opacity:.4}
.data textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);
  font:16px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:8px}
.data .msg{color:var(--muted);font-size:13px}
.sheet-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:24px}
.sheet-nav button{min-height:48px;border-radius:14px;background:var(--bg);font-weight:700;padding:0 12px}
.sheet-nav button:disabled{opacity:.35}
.sheet-nav .next{background:var(--kind);color:var(--on-kind)}
.sheet-nav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.k-push{--kind:var(--push);--kind-soft:var(--push-soft)} .k-pull{--kind:var(--pull);--kind-soft:var(--pull-soft)}
.k-morning{--kind:var(--ink);--kind-soft:var(--bg)}
</style>
</head>

  <h1 class="title" id="title"></h1>

<main class="wrap" id="view"></main>

</div>

me": "Press Arnold con mancuernas", "muscles": "Deltoides frontal y lateral, tríceps", "steps": ["Siéntate en un banco vertical con las mancuernas a la altura de la barbilla, palmas hacia ti y codos al frente.", "Al empujar hacia arriba, gira las palmas hacia adelante y abre los codos hacia los lados.", "Termina con los brazos casi extendidos sobre la cabeza, palmas al frente.", "Invierte el giro al bajar hasta la posición inicial."], "tips": ["Mantén la espalda pegada al respaldo; no arquees para terminar la repetición.", "Gira de forma suave y controlada, sin tirones."]}, "type": "compound", "photo": "img/anim/arnold.webp", "thumb": "img/thumb/arnold.webp"}, "machine_fly": {"img": "anim/machine_fly.webp", "equip": "machine", "en": {"name": "Machine Chest Fly", "muscles": "Chest (mid), front delts", "steps": ["Adjust the seat so the handles are at chest height. Sit tall with your back on the pad.", "Grab the handles with a slight bend in your elbows and your chest up.", "Bring the handles together in a wide arc, squeezing your chest.", "Return slowly until you feel a stretch across your chest, without letting the stack touch."], "tips": ["Keep the elbow bend fixed: it’s a hug, not a press.", "Don’t let your shoulders roll forward at the end.", "Machine taken? Do the High-to-Low cable fly leaning forward; it hits the same mid chest."]}, "es": {"name": "Aperturas en máquina", "muscles": "Pecho (medio), deltoides frontal", "steps": ["Ajusta el asiento para que los agarres queden a la altura del pecho. Siéntate erguido con la espalda en el respaldo.", "Toma los agarres con los codos ligeramente flexionados y el pecho arriba.", "Junta los agarres en un arco amplio, apretando el pecho.", "Regresa lento hasta sentir estiramiento en el pecho, sin que las pesas se toquen."], "tips": ["Mantén fija la flexión del codo: es un abrazo, no un empuje.", "No dejes que los hombros se vayan hacia adelante al final.", "¿Máquina ocupada? Haz aperturas en polea de arriba hacia abajo inclinado hacia adelante; trabajan el mismo pecho medio."]}, "type": "isolation", "photo": "img/anim/machine_fly.webp", "thumb": "img/thumb/machine_fly.webp"}, "db_lateral": {"img": "anim/db_lateral.webp", "equip": "dumbbell", "en": {"name": "Seated Dumbbell Lateral Raise (incline back)", "muscles": "Side delts", "steps": ["Set the bench to the same incline you use for the incline dumbbell press and sit with your back against the pad, dumbbells at your sides.", "Slight bend in your elbows, shoulders down.", "Raise your arms out to the sides, leading with the elbows, to about shoulder height.", "Pause briefly, then lower slowly over 2–3 seconds."], "tips": ["The back support stops you from swinging, so pick a weight you can lift strictly.", "Think “push the dumbbells out to the walls”, not up."]}, "es": {"name": "Elevaciones laterales sentado con mancuernas (respaldo inclinado)", "muscles": "Deltoides lateral", "steps": ["Pon el banco a la misma inclinación que usas para el press inclinado con mancuernas y siéntate con la espalda apoyada, mancuernas a los lados.", "Codos ligeramente flexionados, hombros abajo.", "Eleva los brazos hacia los lados, guiando con los codos, hasta la altura de los hombros.", "Haz una breve pausa y baja lento en 2–3 segundos."], "tips": ["El respaldo evita el balanceo, así que usa un peso que puedas subir con técnica estricta.", "Piensa en “empujar las mancuernas hacia las paredes”, no hacia arriba."]}, "type": "isolation", "photo": "img/anim/db_lateral.webp", "thumb": "img/thumb/db_lateral.webp"}, "pushdown": {"img": "anim/pushdown.webp", "equip": "cable", "en": {"name": "Triceps Pushdowns", "muscles": "Triceps (lateral and medial heads)", "steps": ["Set the pulley high with a straight or V-bar. Stand close with a slight forward lean.", "Pin your elbows to your sides, bent to about 90°.", "Push the bar down until your arms are fully straight and squeeze your triceps.", "Let it come back up to about 90° under control."], "tips": ["Only your forearms move; your elbows stay still.", "Don’t lean your body weight over the bar to move it."]}, "es": {"name": "Extensión de tríceps en polea", "muscles": "Tríceps (cabezas lateral y medial)", "steps": ["Coloca la polea arriba con barra recta o en V. Párate cerca con una ligera inclinación hacia adelante.", "Pega los codos a los costados, flexionados a unos 90°.", "Empuja la barra hacia abajo hasta extender por completo los brazos y aprieta el tríceps.", "Deja que suba controlada hasta unos 90°."], "tips": ["Solo se mueven los antebrazos; los codos quietos.", "No cargues tu peso corporal sobre la barra para moverla."]}, "type": "isolation", "photo": "img/anim/pushdown.webp", "thumb": "img/thumb/pushdown.webp"}, "behind_ext": {"img": "r3c7.jpeg", "equip": "cable", "en": {"name": "Behind-body cable triceps extension", "muscles": "Triceps (long head bias at the finish)", "steps": ["Set a single handle on a high pulley. Stand facing away from the machine so the cable runs over your shoulder.", "Hold the handle in front of your shoulder, elbow bent, upper arm at your side.", "Extend your arm down until it’s straight beside your hip, finishing slightly behind your body.", "Let it return slowly to the bent position. Finish the set, then switch arms."], "tips": ["Keep your upper arm pinned to your side.", "Finishing slightly behind the body is what loads the long head; don’t cut it short."]}, "es": {"name": "Extensión de tríceps en polea por detrás del cuerpo", "muscles": "Tríceps (énfasis en la cabeza larga al final)", "steps": ["Coloca un agarre individual en la polea alta. Párate de espaldas a la máquina para que el cable pase sobre tu hombro.", "Sostén el agarre frente al hombro, codo flexionado y brazo pegado al costado.", "Extiende el brazo hacia abajo hasta quedar recto junto a la cadera, terminando un poco por detrás del cuerpo.", "Regresa lento a la posición flexionada. Termina la serie y cambia de brazo."], "tips": ["Mantén el brazo pegado al costado.", "Terminar un poco por detrás del cuerpo es lo que trabaja la cabeza larga; no lo acortes."]}, "type": "isolation", "photo": "img/r3c7.jpeg", "thumb": "img/thumb/behind_ext.webp"}, "leg_press": {"img": "anim/leg_press.webp", "equip": "machine", "en": {"name": "Leg Press (heavy)", "muscles": "Quads, glutes, adductors", "steps": ["Sit with your back and hips flat on the pad, feet shoulder-width in the middle of the platform.", "Release the safeties and lower the platform until your knees are about 90°, or as deep as you can go without your lower back lifting.", "Push through your whole foot to straighten your legs, stopping just short of locking your knees.", "Lock the safeties back in when you finish."], "tips": ["Knees track over your toes; don’t let them cave in.", "Never let your hips roll up off the seat at the bottom."]}, "es": {"name": "Prensa de piernas (pesada)", "muscles": "Cuádriceps, glúteos, aductores", "steps": ["Siéntate con la espalda y la cadera pegadas al respaldo, pies a la anchura de los hombros en el centro de la plataforma.", "Quita los seguros y baja la plataforma hasta que las rodillas estén cerca de 90°, o tan profundo como puedas sin que se levante la zona lumbar.", "Empuja con todo el pie para extender las piernas, sin bloquear las rodillas.", "Vuelve a poner los seguros al terminar."], "tips": ["Las rodillas siguen la línea de los pies; que no se vayan hacia adentro.", "Nunca dejes que la cadera se despegue del asiento abajo."]}, "type": "compound", "photo": "img/anim/leg_press.webp", "thumb": "img/thumb/leg_press.webp"}, "calf": {"img": "anim/calf.webp", "equip": "dumbbell", "en": {"name": "Calf Raises", "muscles": "Calves (gastrocnemius, soleus)", "steps": ["Stand on a step with the balls of your feet, heels hanging off. Hold a dumbbell or use a machine.", "Lower your heels as far as you can for a full stretch and pause 1 second.", "Rise up onto your toes as high as you can and squeeze for 1 second.", "Repeat with slow, controlled reps."], "tips": ["The pauses at the bottom and top matter more than the weight.", "Knees straight but not locked; don’t bounce.", "You can also do these on the leg press or the Smith machine."]}, "es": {"name": "Elevación de talones", "muscles": "Pantorrillas (gemelos y sóleo)", "steps": ["Párate en un escalón con la parte delantera de los pies y los talones al aire. Sostén una mancuerna o usa una máquina.", "Baja los talones lo más posible para un estiramiento completo y pausa 1 segundo.", "Sube en puntas lo más alto que puedas y aprieta 1 segundo.", "Repite con repeticiones lentas y controladas."], "tips": ["Las pausas abajo y arriba importan más que el peso.", "Rodillas extendidas pero sin bloquear; no rebotes.", "También se puede hacer en la prensa o en la máquina Smith."]}, "type": "isolation", "photo": "img/anim/calf.webp", "thumb": "img/thumb/calf.webp"}, "lat_pd": {"img": "anim/lat_pd.webp", "equip": "machine", "en": {"name": "Lat Pulldown (wide grip)", "muscles": "Lats (width), teres major, upper back, biceps", "steps": ["Set the thigh pad so your legs are locked in snugly. Grab the bar a little wider than shoulder width, palms facing away.", "Sit down with your arms straight, chest up and a slight lean back.", "Pull your shoulder blades down, then drive your elbows down to your sides until the bar reaches your upper chest.", "Let the bar rise slowly until your arms are straight and your lats stretch."], "tips": ["Don’t swing your torso back to move the weight; the lean stays the same.", "Pull with your elbows, not your hands: think of putting them in your back pockets.", "When you want to start on pull-ups, the assisted pull-up machine is the bridge."]}, "es": {"name": "Jalón al pecho (agarre ancho)", "muscles": "Dorsales (amplitud), redondo mayor, espalda alta, bíceps", "steps": ["Ajusta el soporte de los muslos para que las piernas queden firmes. Toma la barra un poco más ancha que los hombros, palmas hacia adelante.", "Siéntate con los brazos extendidos, pecho arriba y una ligera inclinación hacia atrás.", "Baja las escápulas y luego lleva los codos hacia los costados hasta que la barra llegue a la parte alta del pecho.", "Deja que la barra suba lento hasta extender los brazos y estirar los dorsales."], "tips": ["No balancees el torso para mover el peso; la inclinación no cambia.", "Jala con los codos, no con las manos: piensa en meterlos en los bolsillos traseros.", "Cuando quieras empezar con dominadas, la máquina de dominadas asistidas es el puente."]}, "type": "compound", "photo": "img/anim/lat_pd.webp", "thumb": "img/thumb/lat_pd.webp"}, "mts_high_row": {"img": "anim/mts_high_row.webp", "equip": "machine", "cue": {"en": "Handles up top", "es": "Agarres arriba"}, "en": {"name": "Hammer MTS Iso-Lateral High Row", "muscles": "Lats, teres major, rear delts, mid traps", "steps": ["Adjust the seat so you can just reach the handles with your arms extended up and in front. Brace your thighs under the pad.", "Grab the handles and sit tall with your chest up.", "Pull the handles down and back toward your upper ribs, driving your elbows back and down.", "Squeeze your shoulder blades together, then return slowly to a full stretch."], "tips": ["Works one arm at a time (iso-lateral), so it replaces the single-arm dumbbell row.", "Don’t lean back to finish; your torso stays still."]}, "es": {"name": "Remo alto Hammer MTS Iso-Lateral", "muscles": "Dorsales, redondo mayor, deltoides posterior, trapecio medio", "steps": ["Ajusta el asiento para alcanzar los agarres con los brazos extendidos arriba y al frente. Asegura los muslos bajo el soporte.", "Toma los agarres y siéntate erguido con el pecho arriba.", "Tira de los agarres hacia abajo y atrás, hacia las costillas superiores, llevando los codos atrás y abajo.", "Junta las escápulas y regresa lento hasta un estiramiento completo."], "tips": ["Se puede hacer con un brazo a la vez (iso-lateral), así que reemplaza el remo con mancuerna a una mano.", "No te eches hacia atrás para terminar; el torso no se mueve."]}, "type": "compound", "photo": "img/anim/mts_high_row.webp", "thumb": "img/thumb/mts_high_row.webp"}, "cable_row": {"img": "anim/cable_row.webp", "equip": "cable", "en": {"name": "Seated Cable Row (Neutral Grip)", "muscles": "Mid-back (rhomboids, mid traps), lats, rear delts, biceps", "steps": ["Sit with your feet on the platform, knees slightly bent, V-handle in both hands.", "Sit tall with your chest up and arms extended, letting your shoulders reach forward slightly.", "Row the handle to your lower ribs, elbows close to your body.", "Squeeze your shoulder blades, then extend your arms slowly."], "tips": ["Torso stays near vertical: a small lean only, no rocking.", "Lead with your elbows, not your hands."]}, "es": {"name": "Remo sentado en polea (agarre neutro)", "muscles": "Espalda media (romboides, trapecio medio), dorsales, deltoides posterior, bíceps", "steps": ["Siéntate con los pies en la plataforma, rodillas un poco flexionadas, agarre en V con ambas manos.", "Siéntate erguido con el pecho arriba y los brazos extendidos, dejando que los hombros se adelanten un poco.", "Lleva el agarre hacia las costillas bajas, con los codos pegados al cuerpo.", "Junta las escápulas y extiende los brazos lentamente."], "tips": ["Torso casi vertical: solo una ligera inclinación, sin balancearte.", "Guía con los codos, no con las manos."]}, "type": "compound", "photo": "img/anim/cable_row.webp", "thumb": "img/thumb/cable_row.webp"}, "face_pull": {"img": "anim/face_pull.webp", "equip": "cable", "en": {"name": "Face Pulls", "muscles": "Rear delts, mid traps, rotator cuff", "steps": ["Set the pulley at upper-chest to face height with a rope. Grip it with your thumbs toward you.", "Step back so the weight lifts, arms straight, slight lean back.", "Pull the rope toward your face, splitting the ends apart and driving your elbows high and back.", "Finish with your hands beside your ears, pause, and return slowly."], "tips": ["Go light; you should feel the back of your shoulders, not your lower back.", "Elbows stay at or above hand height."]}, "es": {"name": "Face pulls (jalón a la cara)", "muscles": "Deltoides posterior, trapecio medio, manguito rotador", "steps": ["Coloca la polea entre el pecho alto y la cara con una cuerda. Tómala con los pulgares hacia ti.", "Da un paso atrás para levantar el peso, brazos extendidos, ligera inclinación hacia atrás.", "Tira de la cuerda hacia la cara separando los extremos y llevando los codos altos y hacia atrás.", "Termina con las manos junto a las orejas, pausa y regresa lento."], "tips": ["Peso ligero; debes sentirlo en la parte de atrás del hombro, no en la zona lumbar.", "Los codos a la altura de las manos o más arriba."]}, "type": "isolation", "photo": "img/anim/face_pull.webp", "thumb": "img/thumb/face_pull.webp"}, "smith_shrug": {"img": "anim/smith_shrug.webp", "equip": "smith", "en": {"name": "Smith Machine Shrugs", "muscles": "Upper traps", "steps": ["Set the Smith bar at mid-thigh height. Stand close and grip just outside your thighs.", "Unrack by rotating the bar and stand tall with straight arms.", "Lift your shoulders straight up toward your ears as high as you can; hold 1 second.", "Lower all the way for a full stretch."], "tips": ["Straight up and down; don’t roll your shoulders.", "Keep your arms straight so it doesn’t turn into an upright row.", "Use straps if your grip gives out first."]}, "es": {"name": "Encogimientos en máquina Smith", "muscles": "Trapecio superior", "steps": ["Coloca la barra Smith a media altura del muslo. Párate cerca y toma la barra justo por fuera de los muslos.", "Destraba girando la barra y quédate erguido con los brazos extendidos.", "Sube los hombros recto hacia las orejas lo más alto posible; sostén 1 segundo.", "Baja por completo para un estiramiento total."], "tips": ["Recto arriba y abajo; no gires los hombros.", "Brazos extendidos para que no se convierta en un remo al mentón.", "Usa straps si el agarre falla antes."]}, "type": "isolation", "photo": "img/anim/smith_shrug.webp", "thumb": "img/thumb/smith_shrug.webp"}, "preacher": {"img": "anim/preacher.webp", "equip": "dumbbell", "en": {"name": "Single-Arm Dumbbell Preacher Curl (or both arms)", "muscles": "Biceps (short head), brachialis", "steps": ["Rest the back of your upper arm on a pad, armpit snug against the top edge. With no preacher bench, the back of an incline bench set upright works.", "Hold the dumbbell with an underhand grip, arm almost straight.", "Curl the dumbbell up until your forearm is near vertical; squeeze.", "Lower slowly to almost full extension. Finish all reps, then switch arms."], "tips": ["One arm at a time lets you focus on each side. For the both-arms version, hold a dumbbell in each hand over the same pad.", "Don’t lift your elbow off the pad or swing.", "Control the bottom: that’s where the stretch is, and the injury risk."]}, "es": {"name": "Curl predicador a una mano con mancuerna (o ambos brazos)", "muscles": "Bíceps (cabeza corta), braquial", "steps": ["Apoya la parte de atrás del brazo sobre un soporte, con la axila pegada al borde. Sin banco predicador, sirve el respaldo de un banco inclinado puesto casi vertical.", "Toma la mancuerna con agarre supino, brazo casi extendido.", "Sube la mancuerna hasta que el antebrazo quede casi vertical; aprieta.", "Baja lento hasta casi extender por completo. Termina las repeticiones y cambia de brazo."], "tips": ["Un brazo a la vez te deja concentrarte en cada lado. Para la versión con ambos brazos, sostén una mancuerna en cada mano sobre el mismo soporte.", "No despegues el codo del soporte ni te balancees.", "Controla la parte baja: ahí está el estiramiento, y el riesgo de lesión."]}, "type": "isolation", "photo": "img/anim/preacher.webp", "thumb": "img/thumb/preacher.webp"}, "hammer_curl": {"img": "anim/hammer_curl.webp", "equip": "dumbbell", "en": {"name": "Hammer Curl", "muscles": "Brachialis, brachioradialis, biceps", "steps": ["Stand holding dumbbells at your sides with your palms facing each other.", "Keeping your elbows at your sides, curl the dumbbells toward your shoulders.", "Squeeze at the top without letting your elbows drift forward.", "Lower slowly to full extension."], "tips": ["Thumbs up the whole time; no wrist twisting.", "End the set when your form breaks, not when you start swinging."]}, "es": {"name": "Curl martillo", "muscles": "Braquial, braquiorradial, bíceps", "steps": ["De pie con las mancuernas a los lados y las palmas mirándose.", "Con los codos pegados al cuerpo, sube las mancuernas hacia los hombros.", "Aprieta arriba sin que los codos se vayan hacia adelante.", "Baja lento hasta extender por completo."], "tips": ["Pulgares arriba todo el tiempo; no gires la muñeca.", "Termina la serie cuando se rompa la técnica, no cuando empieces a balancearte."]}, "type": "isolation", "photo": "img/anim/hammer_curl.webp", "thumb": "img/thumb/hammer_curl.webp"}, "sl_rdl": {"img": "anim/sl_rdl.webp", "equip": "dumbbell", "en": {"name": "Single-Leg RDL", "muscles": "Hamstrings, glutes, lower back, balance", "steps": ["Stand on one leg with a slight knee bend, holding a dumbbell in the opposite hand.", "Hinge at the hips, pushing them back while your free leg extends straight behind you.", "Lower the dumbbell along your standing leg until your torso is near parallel or you feel a strong hamstring stretch.", "Drive your hips forward to stand tall. Finish all reps, then switch legs."], "tips": ["Keep your hips square to the floor; don’t let the free hip open up.", "Back flat, neck neutral. Lightly hold something with your free hand if you need balance."]}, "es": {"name": "Peso muerto rumano a una pierna", "muscles": "Isquiotibiales, glúteos, zona lumbar, equilibrio", "steps": ["Párate sobre una pierna con la rodilla ligeramente flexionada, con una mancuerna en la mano contraria.", "Flexiona la cadera llevándola hacia atrás mientras la pierna libre se extiende recta hacia atrás.", "Baja la mancuerna junto a la pierna de apoyo hasta que el torso quede casi paralelo o sientas un buen estiramiento en el isquiotibial.", "Empuja la cadera hacia adelante para quedar erguido. Termina las repeticiones y cambia de pierna."], "tips": ["Cadera nivelada hacia el suelo; que no se abra la cadera de la pierna libre.", "Espalda recta, cuello neutro. Apóyate ligeramente con la mano libre si necesitas equilibrio."]}, "type": "compound", "photo": "img/anim/sl_rdl.webp", "thumb": "img/thumb/sl_rdl.webp"}, "leg_curl": {"img": "anim/leg_curl.webp", "equip": "machine", "en": {"name": "Seated Leg Curl", "muscles": "Hamstrings", "steps": ["Adjust the back pad so your knees line up with the machine’s pivot; the lower pad sits just above your heels.", "Lock the thigh pad down firmly on top of your thighs.", "Curl your heels down and back as far as you can; squeeze 1 second.", "Let the pad come back up slowly to a full stretch."], "tips": ["Lean your torso slightly forward for a bigger hamstring stretch.", "Don’t let your hips lift off the seat."]}, "es": {"name": "Curl femoral sentado", "muscles": "Isquiotibiales", "steps": ["Ajusta el respaldo para que las rodillas queden alineadas con el eje de la máquina; el rodillo inferior justo arriba de los talones.", "Asegura firmemente el soporte sobre los muslos.", "Lleva los talones hacia abajo y atrás lo más posible; aprieta 1 segundo.", "Deja que el rodillo suba lento hasta un estiramiento completo."], "tips": ["Inclina un poco el torso hacia adelante para estirar más los isquiotibiales.", "Que la cadera no se despegue del asiento."]}, "type": "isolation", "photo": "img/anim/leg_curl.webp", "thumb": "img/thumb/leg_curl.webp"}, "machine_press": {"img": "anim/machine_press.webp", "equip": "machine", "en": {"name": "Machine Chest Press (or Dumbbell Chest Press)", "muscles": "Chest, front delts, triceps", "steps": ["Adjust the seat so the handles line up with your mid-chest.", "Sit with your back and head on the pad, shoulder blades pulled back, feet planted.", "Press the handles forward until your arms are nearly straight.", "Return slowly until you feel a chest stretch, without letting the stack rest."], "tips": ["Keep your shoulders down and back; don’t let them shrug forward at lockout.", "Elbows sit slightly below shoulder height.", "Alternative: flat dumbbell chest press, same sets and reps. The machine is the default because dumbbells put more stress on the elbows and shoulders."]}, "es": {"name": "Press de pecho en máquina (o press con mancuernas)", "muscles": "Pecho, deltoides frontal, tríceps", "steps": ["Ajusta el asiento para que los agarres queden a la altura de la mitad del pecho.", "Siéntate con la espalda y la cabeza en el respaldo, escápulas atrás, pies firmes.", "Empuja los agarres hacia adelante hasta casi extender los brazos.", "Regresa lento hasta sentir estiramiento en el pecho, sin que las pesas descansen."], "tips": ["Hombros abajo y atrás; que no se adelanten al extender.", "Codos un poco por debajo de la altura de los hombros.", "Alternativa: press de pecho con mancuernas en banco plano, mismas series y repeticiones. La máquina es la opción principal porque las mancuernas cargan más los codos y los hombros."]}, "type": "compound", "photo": "img/anim/machine_press.webp", "thumb": "img/thumb/machine_press.webp"}, "db_shoulder_press": {"img": "anim/db_shoulder_press.webp", "equip": "dumbbell", "en": {"name": "Seated Dumbbell Shoulder Press", "muscles": "Front and side delts, triceps", "steps": ["Set the bench almost upright (80–90°). Bring the dumbbells to shoulder height, palms forward.", "Elbows slightly in front of your body, forearms vertical.", "Press the dumbbells up until your arms are nearly straight overhead.", "Lower under control to about ear or chin level."], "tips": ["Keep your lower back against the pad and your ribs down.", "Don’t bang the dumbbells together at the top."]}, "es": {"name": "Press de hombro sentado con mancuernas", "muscles": "Deltoides frontal y lateral, tríceps", "steps": ["Pon el banco casi vertical (80–90°). Sube las mancuernas a la altura de los hombros, palmas al frente.", "Codos un poco por delante del cuerpo, antebrazos verticales.", "Empuja las mancuernas hasta casi extender los brazos sobre la cabeza.", "Baja controlado hasta la altura de las orejas o la barbilla."], "tips": ["Mantén la zona lumbar pegada al respaldo y las costillas abajo.", "No choques las mancuernas arriba."]}, "type": "compound", "photo": "img/anim/db_shoulder_press.webp", "thumb": "img/thumb/db_shoulder_press.webp"}, "lth_fly": {"img": "anim/lth_fly.webp", "equip": "cable", "cue": {"en": "Pulleys low", "es": "Poleas abajo"}, "en": {"name": "Low-to-High Cable Fly", "muscles": "Upper chest, front delts", "steps": ["Set both pulleys at the lowest position. Take a handle in each hand and step forward into a staggered stance.", "Start with your arms down and slightly back, palms forward, a slight bend in your elbows.", "Sweep the handles up and together in an arc, finishing around chin height in front of you.", "Squeeze your upper chest, then lower slowly back to the start."], "tips": ["Keep the elbow bend fixed and your chest up.", "Do it right before the High-to-Low fly on the same station; only the pulley height changes."]}, "es": {"name": "Aperturas en polea de abajo hacia arriba", "muscles": "Pecho superior, deltoides frontal", "steps": ["Coloca ambas poleas en la posición más baja. Toma un agarre en cada mano y da un paso adelante con los pies escalonados.", "Empieza con los brazos abajo y un poco atrás, palmas al frente, codos ligeramente flexionados.", "Lleva los agarres hacia arriba y al centro en un arco, terminando a la altura de la barbilla.", "Aprieta el pecho superior y baja lento a la posición inicial."], "tips": ["Mantén fija la flexión del codo y el pecho arriba.", "Hazlo justo antes de las aperturas de arriba hacia abajo en la misma estación; solo cambia la altura de la polea."]}, "type": "isolation", "photo": "img/anim/lth_fly.webp", "thumb": "img/thumb/lth_fly.webp"}, "htl_fly": {"img": "anim/htl_fly.webp", "equip": "cable", "en": {"name": "High-to-Low Cable Fly (standing)", "muscles": "Lower chest", "steps": ["Set both pulleys high, above your head. Take a handle in each hand and step forward into a staggered stance, torso upright.", "Start with your arms wide and up, a slight bend in your elbows, chest open.", "Sweep the handles down and together in front of your hips.", "Squeeze, then return slowly until you feel a chest stretch."], "tips": ["Stay upright: leaning forward shifts the work to the middle chest.", "Move only at the shoulders; don’t press with your arms."]}, "es": {"name": "Aperturas en polea de arriba hacia abajo (de pie)", "muscles": "Pecho inferior", "steps": ["Coloca ambas poleas arriba, por encima de la cabeza. Toma un agarre en cada mano y da un paso adelante con los pies escalonados, torso erguido.", "Empieza con los brazos abiertos y arriba, codos ligeramente flexionados, pecho abierto.", "Lleva los agarres hacia abajo y al centro, frente a la cadera.", "Aprieta y regresa lento hasta sentir estiramiento en el pecho."], "tips": ["Mantente erguido: inclinarte hacia adelante pasa el trabajo al pecho medio.", "Muévete solo desde los hombros; no empujes con los brazos."]}, "type": "isolation", "photo": "img/anim/htl_fly.webp", "thumb": "img/thumb/htl_fly.webp"}, "cable_lateral": {"img": "anim/cable_lateral.webp", "equip": "cable", "en": {"name": "Cable Lateral Raise (constant tension)", "muscles": "Side delts", "steps": ["Set a pulley at the lowest position. Stand side-on to the machine and hold the handle in your far hand.", "Start with your hand at hip level, a slight bend in your elbow.", "Raise your arm out to the side to about shoulder height.", "Lower slowly, keeping tension. Finish all reps, then switch sides."], "tips": ["The cable keeps tension at the bottom, where dumbbells don’t; don’t rush that part.", "No leaning away or shrugging to move the weight."]}, "es": {"name": "Elevación lateral en polea", "muscles": "Deltoides lateral", "steps": ["Coloca una polea en la posición más baja. Párate de lado a la máquina y toma el agarre con la mano más lejana.", "Empieza con la mano a la altura de la cadera, codo ligeramente flexionado.", "Eleva el brazo hacia el lado hasta la altura del hombro.", "Baja lento manteniendo la tensión. Termina las repeticiones y cambia de lado."], "tips": ["La polea mantiene tensión abajo, donde las mancuernas no; no apresures esa parte.", "No te inclines ni encojas el hombro para mover el peso."]}, "type": "isolation", "photo": "img/anim/cable_lateral.webp", "thumb": "img/thumb/cable_lateral.webp"}, "rope_pushdown": {"img": "anim/rope_pushdown.webp", "equip": "cable", "en": {"name": "Rope Pushdowns", "muscles": "Triceps (lateral head)", "steps": ["Set the pulley high with a rope. Stand close with a slight forward lean, elbows pinned at your sides.", "Push the rope down until your arms are straight.", "At the bottom, spread the rope ends apart and squeeze your triceps.", "Return slowly to about 90° at the elbow."], "tips": ["Your elbows don’t move forward or back.", "Spreading the rope at the bottom gives a stronger contraction."]}, "es": {"name": "Extensión de tríceps con cuerda", "muscles": "Tríceps (cabeza lateral)", "steps": ["Coloca la polea arriba con una cuerda. Párate cerca con una ligera inclinación hacia adelante, codos pegados a los costados.", "Empuja la cuerda hacia abajo hasta extender los brazos.", "Abajo, separa los extremos de la cuerda y aprieta el tríceps.", "Regresa lento hasta unos 90° en el codo."], "tips": ["Los codos no se mueven ni hacia adelante ni hacia atrás.", "Separar la cuerda abajo da una contracción más fuerte."]}, "type": "isolation", "photo": "img/anim/rope_pushdown.webp", "thumb": "img/thumb/rope_pushdown.webp"}, "katana": {"img": "anim/katana.webp", "equip": "cable", "en": {"name": "Katana Press", "muscles": "Triceps (long head emphasis)", "steps": ["Set the pulley low. Stand facing away from the machine with the cable running behind you.", "Hold the handle behind your head, elbow(s) pointing up.", "Extend overhead until your arms are straight.", "Lower slowly behind your head into a deep stretch."], "tips": ["Keep your upper arms still; only the elbows move.", "The deep stretch behind the head is the point; don’t cut it short.", "One arm at a time works too: extend up and slightly out on a diagonal, like drawing a sword."]}, "es": {"name": "Press Katana", "muscles": "Tríceps (énfasis en la cabeza larga)", "steps": ["Coloca la polea abajo. Párate de espaldas a la máquina con el cable pasando por detrás de ti.", "Sostén el agarre detrás de la cabeza, con el codo o los codos hacia arriba.", "Extiende por encima de la cabeza hasta que los brazos queden rectos.", "Baja lento detrás de la cabeza hasta un estiramiento profundo."], "tips": ["Brazos quietos; solo se mueven los codos.", "El estiramiento profundo detrás de la cabeza es la clave; no lo acortes.", "También se puede con un brazo: extiende hacia arriba y un poco hacia afuera en diagonal, como desenvainando una espada."]}, "type": "isolation", "photo": "img/anim/katana.webp", "thumb": "img/thumb/katana.webp"}, "lunges": {"img": "anim/lunges.webp", "equip": "dumbbell", "en": {"name": "Walking Lunges", "muscles": "Quads, glutes, adductors", "steps": ["Stand tall holding dumbbells at your sides.", "Take a long step forward and lower until both knees are about 90°, back knee just above the floor.", "Push through your front heel to stand and bring your back leg forward into the next step.", "Keep alternating legs for the whole set."], "tips": ["Torso upright; your front knee tracks over your toes.", "Longer steps work the glutes more; shorter steps work the quads more."]}, "es": {"name": "Zancadas caminando", "muscles": "Cuádriceps, glúteos, aductores", "steps": ["De pie, erguido, con mancuernas a los lados.", "Da un paso largo hacia adelante y baja hasta que ambas rodillas estén cerca de 90°, la rodilla de atrás justo arriba del suelo.", "Empuja con el talón delantero para subir y lleva la pierna de atrás al siguiente paso.", "Alterna las piernas durante toda la serie."], "tips": ["Torso erguido; la rodilla delantera sigue la línea del pie.", "Pasos largos trabajan más el glúteo; pasos cortos, más el cuádriceps."]}, "type": "compound", "photo": "img/anim/lunges.webp", "thumb": "img/thumb/lunges.webp"}, "leg_ext": {"img": "anim/leg_ext.webp", "equip": "machine", "en": {"name": "Leg Extension", "muscles": "Quads", "steps": ["Adjust the back pad so your knees line up with the machine’s pivot; the ankle pad sits on your lower shins.", "Hold the side handles and keep your hips down on the seat.", "Extend your legs until they’re straight; squeeze your quads for 1 second.", "Lower slowly until your knees bend past 90°."], "tips": ["Slow on the way down; don’t kick the weight up.", "Leaning back slightly gives the quads (rectus femoris) a bigger stretch."]}, "es": {"name": "Extensión de piernas", "muscles": "Cuádriceps", "steps": ["Ajusta el respaldo para que las rodillas queden alineadas con el eje de la máquina; el rodillo sobre la parte baja de la espinilla.", "Sujeta las manijas laterales y mantén la cadera pegada al asiento.", "Extiende las piernas hasta quedar rectas; aprieta el cuádriceps 1 segundo.", "Baja lento hasta pasar los 90° de flexión."], "tips": ["Baja lento; no patees el peso.", "Inclinarte un poco hacia atrás estira más el cuádriceps (recto femoral)."]}, "type": "isolation", "photo": "img/anim/leg_ext.webp", "thumb": "img/thumb/leg_ext.webp"}, "vbar_pd": {"img": "anim/vbar_pd.webp", "equip": "machine", "en": {"name": "Close-Grip Lat Pulldown (V-bar)", "muscles": "Lats (lower), teres major, mid-back, biceps", "steps": ["Attach a V-handle (close, palms facing each other) to the lat pulldown and lock your thighs under the pad.", "Start with your arms straight overhead and your chest up.", "Pull the handle to your upper chest, driving your elbows down and close to your sides.", "Return slowly to a full stretch at the top."], "tips": ["Lean back only slightly; this is not a row.", "The close grip lets your elbows travel further down, so finish each rep with a hard squeeze."]}, "es": {"name": "Jalón al pecho agarre cerrado (barra V)", "muscles": "Dorsales (zona baja), redondo mayor, espalda media, bíceps", "steps": ["Coloca un agarre en V (cerrado, palmas mirándose) en el jalón y asegura los muslos bajo el soporte.", "Empieza con los brazos extendidos arriba y el pecho arriba.", "Jala el agarre hacia la parte alta del pecho, llevando los codos abajo y pegados a los costados.", "Regresa lento hasta un estiramiento completo arriba."], "tips": ["Inclínate solo un poco hacia atrás; no es un remo.", "El agarre cerrado permite bajar más los codos, así que termina cada repetición con un buen apretón."]}, "type": "compound", "photo": "img/anim/vbar_pd.webp", "thumb": "img/thumb/vbar_pd.webp"}, "mts_row": {"img": "anim/mts_row.webp", "equip": "machine", "cue": {"en": "Handles in front", "es": "Agarres al frente"}, "en": {"name": "Hammer MTS Iso-Lateral Row", "muscles": "Mid-back (rhomboids, mid traps), lats, rear delts", "steps": ["Adjust the seat so the handles are at lower-chest height and the chest pad touches your chest with your arms extended.", "Grab the handles and sit tall against the chest pad.", "Row the handles straight back toward your torso, driving your elbows past your body.", "Squeeze your shoulder blades together, then extend slowly to a full stretch."], "tips": ["Keep your chest on the pad the whole time.", "Do one arm at a time to even out strength between sides."]}, "es": {"name": "Remo Hammer MTS Iso-Lateral", "muscles": "Espalda media (romboides, trapecio medio), dorsales, deltoides posterior", "steps": ["Ajusta el asiento para que los agarres queden a la altura del pecho bajo y el soporte toque el pecho con los brazos extendidos.", "Toma los agarres y siéntate erguido contra el soporte.", "Rema los agarres recto hacia el torso, llevando los codos más allá del cuerpo.", "Junta las escápulas y extiende lento hasta un estiramiento completo."], "tips": ["Pecho en el soporte todo el tiempo.", "Hazlo con un brazo a la vez para igualar la fuerza entre lados."]}, "type": "compound", "photo": "img/anim/mts_row.webp", "thumb": "img/thumb/mts_row.webp"}, "straight_arm": {"img": "anim/straight_arm.webp", "equip": "cable", "en": {"name": "Straight-Arm Pulldown (bar)", "muscles": "Lats, teres major", "steps": ["Set the pulley high with a straight bar. Grab it shoulder-width, palms down, and step back.", "Start leaning slightly forward with straight arms (soft elbows) up in front of you, feeling your lats stretch.", "Sweep the bar down in an arc to your thighs with straight arms. As it comes down, bring your torso up to upright and finish leaning slightly back.", "Squeeze your lats, then let the bar rise slowly as you return to the forward lean."], "tips": ["Arms stay straight: it’s a shoulder movement, not a triceps pushdown.", "The torso moves smoothly with the bar; don’t jerk back to throw the weight."]}, "es": {"name": "Jalón con brazos rectos (barra)", "muscles": "Dorsales, redondo mayor", "steps": ["Coloca la polea arriba con una barra recta. Tómala a la anchura de los hombros, palmas hacia abajo, y da un paso atrás.", "Empieza con el torso un poco inclinado hacia adelante y los brazos rectos (codos suaves) arriba y al frente, sintiendo el estiramiento del dorsal.", "Lleva la barra hacia abajo en un arco hasta los muslos con los brazos rectos. Mientras baja, endereza el torso y termina ligeramente inclinado hacia atrás.", "Aprieta los dorsales y deja que la barra suba lento mientras vuelves a la inclinación inicial."], "tips": ["Brazos rectos: es un movimiento del hombro, no un pushdown de tríceps.", "El torso acompaña la barra de forma suave; no des tirones hacia atrás para lanzar el peso."]}, "type": "isolation", "photo": "img/anim/straight_arm.webp", "thumb": "img/thumb/straight_arm.webp"}, "rev_pec": {"img": "anim/rev_pec.webp", "equip": "machine", "en": {"name": "Reverse Pec Deck", "muscles": "Rear delts, mid traps", "steps": ["Sit facing the pad with the handles set for rear delts, at shoulder height.", "Grab the handles with your arms straight in front, palms facing each other or down.", "Open your arms out to the sides in a wide arc until they’re in line with your body.", "Pause, then return slowly without letting the weights touch."], "tips": ["Lead with your elbows and keep the work in the rear delts; don’t squeeze your shoulder blades hard.", "Light weight, no jerking."]}, "es": {"name": "Pec deck inverso", "muscles": "Deltoides posterior, trapecio medio", "steps": ["Siéntate de frente al respaldo con los agarres en posición para deltoides posterior, a la altura de los hombros.", "Toma los agarres con los brazos extendidos al frente, palmas mirándose o hacia abajo.", "Abre los brazos hacia los lados en un arco amplio hasta alinearlos con el cuerpo.", "Pausa y regresa lento sin que las pesas se toquen."], "tips": ["Guía con los codos y mantén el trabajo en el deltoides posterior; no juntes fuerte las escápulas.", "Peso ligero, sin tirones."]}, "type": "isolation", "photo": "img/anim/rev_pec.webp", "thumb": "img/thumb/rev_pec.webp"}, "back_ext": {"img": "anim/back_ext.webp", "equip": "machine", "en": {"name": "Back Extension (machine)", "muscles": "Lower back (erectors), glutes", "steps": ["Adjust the seat so the back pad sits across your upper back and your feet are flat on the platform.", "Cross your arms on your chest and sit tall, leaning forward against the pad.", "Push the pad back by extending your hips and lower back until your torso is upright or slightly back.", "Return slowly to the forward position, in control the whole way."], "tips": ["Move smoothly; don’t throw your head back or jerk the weight.", "Use a moderate weight: this builds lower-back endurance, it’s not a max lift."]}, "es": {"name": "Extensión de espalda (máquina)", "muscles": "Zona lumbar (erectores), glúteos", "steps": ["Ajusta el asiento para que el respaldo quede sobre la parte alta de la espalda y los pies apoyados en la plataforma.", "Cruza los brazos sobre el pecho y siéntate erguido, inclinado hacia adelante contra el respaldo.", "Empuja el respaldo hacia atrás extendiendo la cadera y la zona lumbar hasta que el torso quede vertical o un poco atrás.", "Regresa lento a la posición inclinada, con control todo el tiempo."], "tips": ["Movimiento suave; no eches la cabeza hacia atrás ni des tirones.", "Usa un peso moderado: es para la resistencia de la zona lumbar, no un máximo."]}, "type": "isolation", "photo": "img/anim/back_ext.webp", "thumb": "img/thumb/back_ext.webp"}, "bayesian": {"img": "r15c6.png", "equip": "cable", "en": {"name": "Cable Bayesian Curl", "muscles": "Biceps (long head)", "steps": ["Set a single handle at the lowest pulley. Face away from the machine and step forward so your arm is pulled behind your body.", "Staggered stance; the working arm hangs slightly behind your torso, palm forward.", "Curl the handle up without letting your elbow drift far forward.", "Lower slowly back to the stretched position. Finish the set, then switch arms."], "tips": ["The stretch with your arm behind you is the point of this exercise.", "Keep your torso still; don’t lean forward to move the weight."]}, "es": {"name": "Curl bayesiano en polea", "muscles": "Bíceps (cabeza larga)", "steps": ["Coloca un agarre individual en la polea más baja. Ponte de espaldas a la máquina y da un paso adelante para que el brazo quede detrás del cuerpo.", "Pies escalonados; el brazo de trabajo cuelga un poco detrás del torso, palma al frente.", "Sube el agarre sin que el codo se adelante demasiado.", "Baja lento a la posición de estiramiento. Termina la serie y cambia de brazo."], "tips": ["El estiramiento con el brazo atrás es la clave de este ejercicio.", "Torso quieto; no te inclines hacia adelante para mover el     <p>${esc(t('dataInfo'))}</p>
    <div class="row"><button id="backup" ${Object.keys(W).length ? '' : 'disabled'}>${t('backup')}</button>
      <button id="restore">${t('restore')}</button></div><div id="dataBox"></div></section>`;
}
function showBackupText(text, note) {
  $('#dataBox').innerHTML = `<p class="msg">${esc(note)}</p><textarea id="backupText" readonly>${esc(text)}</textarea>`;
  const ta = $('#backupText'); ta.focus(); ta.select();
}
function backup() {
  const text = JSON.stringify({app: 'routine', v: 1, weights: W});
  showBackupText(text, t('copyFail'));
  try {
    navigator.clipboard.writeText(text).then(() => {
      const box = $('#backupText');
      if (box && box.value === text) $('#dataBox .msg').textContent = t('copied');
    }, () => {});
  } catch (e) {}
}
function restoreApply() {
  let v;
  try { v = JSON.parse($('#restoreText').value); } catch (e) { v = null; }
  const w = v && (v.weights || v);
  const ok = w && typeof w === 'object' && Object.values(w).every(r => r && typeof r.cur === 'number' && Array.isArray(r.hist));
  if (!ok || !Object.keys(w).length) { $('#restoreMsg').textContent = t('restoreBad'); return; }
  W = w; saveW(); shown = ''; render();
  $('#dataBox').innerHTML = `<p class="msg">${esc(t('restored'))}</p>`;
}

function thumb(id) {
  const e = DATA.exercises[id];
  return e.thumb ? `<span class="thumb"><img src="${e.thumb}" alt="" loading="lazy" decoding="async"></span>` : `<span class="thumb none">${ICON_NONE}</span>`;
}
function row(day, it, i) {
  const e = DATA.exercises[it.id], eq = DATA.equip[e.equip][lang];
  return `<li><button class="ex" data-day="${day.id}" data-i="${i}">${thumb(it.id)}
    <span><span class="ex-name">${esc(txt(it.id).name)}</span>
      <span class="ex-sub"><span class="chip ${e.equip === 'cable' ? 'cable' : ''}">${esc(eq)}</span><span class="wt" data-wt="${it.id}">${wLabel(it.id)}</span></span></span>
    <span class="ex-sets">${presc(it)}${it.rpt ? `<small>${t('rpt')}</small>` : ''}</span></button></li>`;
}
// consecutive cable exercises (3+) inside a group get a "stay at the station" bracket
function groupBody(day, items, start) {
  const segs = [];
  for (let i = 0; i < items.length;) {
    let j = i;
    while (j < items.length && DATA.exercises[items[j].id].equip === 'cable') j++;
    if (j - i >= 3) { segs.push({run: true, from: i, to: j}); i = j; continue; }
    const last = segs[segs.length - 1];
    if (last && !last.run) last.to = i + 1; else segs.push({run: false, from: i, to: i + 1});
    i++;
  }
  return segs.map(s => {
    const list = '<ol class="list">' + items.slice(s.from, s.to).map((it, k) => row(day, it, start + s.from + k)).join('') + '</ol>';
    return s.run ? `<div class="run"><p class="run-label">${ICON_CABLE}${esc(t('run', {n: s.to - s.from}))}</p>${list}</div>` : list;
  }).join('');
}

function renderHome() {
  const tiles = DATA.days.map(d => `<button class="tile ${d.kind}" data-go="${d.id}">
      <span class="tile-kind">${esc(t(d.kind))}</span><span class="tile-num">${d.label.slice(-1)}</span>
      <span class="tile-focus">${esc(d.focus[lang])}</span>
      <span class="tile-meta">${flat(d).length} ${t('ex')} · ${total(d)} ${t('sets')}</span></button>`).join('');
  const m = DATA.morning;
  $('#view').innerHTML = `<p class="eyebrow">${t('days')}</p><div class="grid">${tiles}</div>
    <p class="eyebrow" style="margin-top:26px">${t('train')}</p><ul class="rules"><li>${t('rule0')}</li><li>${t('rule1')}</li><li>${t('rule2')}</li></ul>
    <p class="eyebrow" style="margin-top:26px">${t('morning')}</p>
    <ol class="list">${m.groups[0].items.map((it, i) => row(m, it, i)).join('')}</ol>
    <p class="hint">${t('hint')}</p>${dataSection()}`;
}
const openT = new Set();   // expanded "tap to show" sections
function toggle(key, label, body) {
  const open = openT.has(key);
  return `<button class="toggle" data-toggle="${key}" aria-expanded="${open}"><span>${label}</span><span class="chev">${t(open ? 'hide' : 'show')}</span></button>
    <div class="toggle-body" id="tb-${key}" ${open ? '' : 'hidden'}>${body}</div>`;
}
const legStart = d => { let n = 0; for (const g of d.groups) { if (g.key === 'legs') return n; n += g.items.length; } return -1; };
function warmText(id, scheme) {
  const r = W[id];
  if (!r) return t(scheme === 'main' ? 'warmGeneric' : 'legGeneric');
  const sets = scheme === 'main' ? [[0.5, 5], [0.75, 3], [1, 1]] : [[0.5, 8], [0.75, 4]];
  const line = sets.map(([f, n]) => `${fmtW(Math.round(r.cur * f / 5) * 5)} × ${n}`).join(' · ');
  return scheme === 'main' ? `${line} · ${t('restMin')}` : line;
}
function renderDay(d) {
  const items = flat(d), first = items[0], ls = legStart(d), firstLeg = items[ls];
  const pre = d.pre && d.pre.length ? `<section class="group">${toggle('pre-' + d.id, t('preWarm'),
    `<ol class="list">${d.pre.map(it => `<li><div class="ex static">${thumb(it.id)}
      <span><span class="ex-name">${esc(txt(it.id).name)}</span><span class="pre-note">${esc(t('pre_' + it.id))}</span></span>
      <span class="ex-sets">${presc(it)}</span></div></li>`).join('')}</ol>`)}</section>` : '';
  const warm = `<section class="group"><h3 class="group-label"><span>${t('warmup')}</span></h3>
    <ol class="list"><li><button class="ex" data-day="${d.id}" data-i="0">${thumb(first.id)}
      <span><span class="ex-name">${esc(txt(first.id).name)}</span>
        <span class="warm-line" data-warm="${first.id}" data-scheme="main">${esc(warmText(first.id, 'main'))}</span>
        ${W[first.id] ? '' : `<span class="pre-note">${esc(t('warmSave'))}</span>`}</span>
      <span class="ex-sets">›</span></button></li></ol></section>`;
  let start = 0;
  const groups = d.groups.map(g => {
    const legWarm = g.key === 'legs' && firstLeg ? toggle('leg-' + d.id, t('legWarm'),
      `<div class="legwarm"><span class="warm-line" data-warm="${firstLeg.id}" data-scheme="legs">${esc(warmText(firstLeg.id, 'legs'))}</span>
        <span class="pre-note">${esc(t('before', {name: txt(firstLeg.id).name}))}. ${esc(t('legWarmNote'))}</span></div>`) + '<div style="height:10px"></div>' : '';
    const html = `<section class="group"><h3 class="group-label"><span>${t(g.key)}</span><span>${g.items.length}</span></h3>${legWarm}${groupBody(d, g.items, start)}</section>`;
    start += g.items.length; return html;
  }).join('');
  $('#view').innerHTML = `<div class="k-${d.kind}"><div class="day-head ${d.kind}"><h2>${esc(d.label)}</h2><p>${esc(d.focus[lang])}</p>
    <p class="meta">${flat(d).length} ${t('ex')} · ${total(d)} ${t('sets')}</p></div>${pre}${warm}${groups}</div>`;
}

function openSheet(d, i) {
  const items = flat(d), it = items[i];
  if (!it) return closeSheet();
  const e = DATA.exercises[it.id], x = e[lang];
  const photo = e.photo ? `<div class="photo"><img src="${e.photo}" alt="${esc(x.name)}"></div>`
    : `<div class="photo none">${ICON_NONE}<strong>${esc(e.cue ? e.cue[lang] : '')}</strong><span>${t('noPhoto')}</span></div>`;
  const sheet = $('#sheet');
  sheet.className = 'sheet k-' + d.kind;
  sheet.innerHTML = `<div class="sheet-inner"><div class="grab"></div>
    <div class="sheet-top"><button class="close" id="close">${t('close')}</button>${langToggle()}</div>
    ${photo}
    <h2 id="sheetTitle">${esc(x.name)}</h2>
    <div class="facts"><span class="fact kind">${it.rpt ? `${t('setsN', {n: it.sets})} · ${presc(it)}` : presc(it)}</span>${it.rpt ? `<span class="fact">${t('rptLong')}</span>` : ''}<span class="fact">${esc(DATA.equip[e.equip][lang])}</span></div>
    ${d.kind === 'morning' ? '' : weightPanel(it.id, Object.assign({first: i === 0, legFirst: i === legStart(d)}, it))}
    ${d.kind === 'morning' ? '' : `<div class="plan"><p><strong>${t('effortLbl')}</strong>${esc(t('eff_' + effort(it)))}</p>
      <p><strong>${t('progLbl')}</strong>${esc(progression(it))}</p></div>`}
    <h3>${t('muscles')}</h3><p>${esc(x.muscles)}</p>
    <h3>${t('how')}</h3><ol class="steps">${x.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
    <h3>${t('tips')}</h3><ul class="tips">${x.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <nav class="sheet-nav"><button class="prev" data-step="-1" ${i === 0 ? 'disabled' : ''}>‹ ${t('prev')}</button>
      <span>${i + 1} ${t('of')} ${items.length}</span>
      <button class="next" data-step="1" ${i === items.length - 1 ? 'disabled' : ''}>${t('next')} ›</button></nav></div>`;
  const wrap = $('#sheetWrap');
  const wasOpen = !wrap.hidden;
  wrap.hidden = false; document.body.style.overflow = 'hidden';
  if (wasOpen) sheet.scrollTop = 0;
}
function closeSheet() { $('#sheetWrap').hidden = true; document.body.style.overflow = ''; }
function langToggle() {
  return `<div class="lang" role="group" aria-label="Language">` +
    ['en', 'es'].map(l => `<button data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('') + '</div>';
}

function route() {
  const m = location.hash.slice(1).match(/^(push1|pull1|push2|pull2|morning)(?:-(\d+))?$/);
  return m ? {day: m[1], i: m[2] != null ? +m[2] : null} : {day: null, i: null};
}
function render() {
  const r = route();
  const d = r.day && r.day !== 'morning' ? dayById(r.day) : null;
  document.documentElement.lang = lang;
  for (const b of document.querySelectorAll('.bar .lang button')) b.setAttribute('aria-pressed', b.dataset.lang === lang);
  $('#back').hidden = !d; $('#backLabel').textContent = t('back');
  $('#title').textContent = d ? d.label : t('app');
  const key = (d ? d.id : 'home') + ':' + lang;
  if (key !== shown) { d ? renderDay(d) : renderHome(); if (!shown.startsWith(d ? d.id : 'home')) window.scrollTo(0, 0); shown = key; }
  if (r.i != null) openSheet(dayById(r.day), r.i); else closeSheet();
}
function go(hash, replace) {
  if (replace) { history.replaceState(null, '', hash || location.pathname); render(); } else location.hash = hash;
}
function setLang(l) { lang = l; try { localStorage.setItem('routine.lang', l); } catch (e) {} render(); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('button, .scrim'); if (!b) return;
  if (b.dataset.lang) return setLang(b.dataset.lang);
  if (b.dataset.toggle) {
    const k = b.dataset.toggle, open = !openT.has(k);
    if (open) openT.add(k); else openT.delete(k);
    document.getElementById('tb-' + k).hidden = !open;
    b.setAttribute('aria-expanded', open); b.querySelector('.chev').textContent = t(open ? 'hide' : 'show');
    return;
  }
  if (b.dataset.go) return go('#' + b.dataset.go);
  if (b.classList.contains('ex')) return go('#' + b.dataset.day + '-' + b.dataset.i);
  if (b.id === 'back') return go('', true);
  if (b.id === 'close' || b.id === 'scrim') { const r = route(); return go(r.day === 'morning' ? '' : '#' + r.day, true); }
  if (b.dataset.step) { const r = route(); return go('#' + r.day + '-' + (r.i + +b.dataset.step), true); }
  if (b.dataset.wstep) { const inp = $('#w-input'), cur = parseFloat(inp.value);
    return setWeight(inp.dataset.ex, Math.max(0, (isNaN(cur) ? 0 : cur) + +b.dataset.wstep)); }
  if (b.id === 'backup') return backup();
  if (b.id === 'restore') { $('#dataBox').innerHTML = `<p class="msg" id="restoreMsg">${esc(t('restoreHint'))}</p>
      <textarea id="restoreText"></textarea><div class="row"><button id="restoreApply">${t('restoreApply')}</button></div>`; return; }
  if (b.id === 'restoreApply') return restoreApply();
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'w-input') { const v = parseFloat(ev.target.value); if (!isNaN(v)) setWeight(ev.target.dataset.ex, v); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'w-input') { ev.target.blur(); return; }   // saves via the change event
  if (ev.key === 'Escape' && !$('#sheetWrap').hidden) $('#close').click();
});
window.addEventListener('hashchange', render);
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
